[package]
name = "colink"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.97"
axum = "0.8.1"
bcrypt = "0.17.0"
clap = { version = "4.5.31", features = ["derive"] }
console = "0.15.11"
cuid2 = "0.1.4"
jiff = "0.2.4"
rust-embed = "8.6.0"
sea-orm = { version = "1.1.7", features = [
    "sqlx-sqlite",
    "macros",
    "runtime-tokio-rustls",
] }
serde = "1.0.219"
serde_json = "1.0.140"
tokio = { version = "1.43.0", features = ["full"] }
tower = "0.5.2"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"

[profile.release]
strip = true
opt-level = "z"