[package]
name = "colink"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.97"
axum = "0.8.1"
axum-extra = { version = "0.10.0", features = ["cookie"] }
axum-test = "17.2.0"
bcrypt = "0.17.0"
clap = { version = "4.5.31", features = ["derive"] }
console = "0.15.11"
cuid2 = "0.1.4"
jiff = "0.2.4"
meilisearch-sdk = "0.28.0"
mime_guess = "2.0.5"
regex = "1.11.1"
rust-embed = "8.6.0"
sea-orm = { version = "1.1.8", features = [
    "sqlx-sqlite",
    "macros",
    "runtime-tokio-rustls",
] }
serde = "1.0.219"
serde_json = "1.0.140"
tokio = { version = "1.43.0", features = ["full"] }
tower = "0.5.2"
tower-http = { version = "0.6.2", features = ["cors"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

[profile.release]
# strip = true
opt-level = "z"
